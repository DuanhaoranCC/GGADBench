[tool.black]
line-length = 100
target-version = ["py38"]
extend-exclude = '/(Dataset|results|cache|cache_[^/]*|\.venv)/'

[tool.isort]
profile = "black"
line_length = 100
py_version = 38
known_first_party = ["ggad", "gfm", "baselines", "common", "util"]
skip_glob = ["**/cache/**", "**/results/**", "**/Dataset/**", "**/.venv/**"]
